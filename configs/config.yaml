kafka:
  brokers:
    - "localhost:19092"
  topic: "ecommerce-events"
  batch_size: 100
  batch_timeout: "500ms"
  compression: "snappy"

state_machine:
  transitions:
    - from: "landing"
      to: "search"
      probability: 0.60
    - from: "search"
      to: "product_view"
      probability: 0.25
    - from: "product_view"
      to: "add_to_cart"
      probability: 0.10
    - from: "product_view"
      to: "search"
      probability: 0.30
    - from: "add_to_cart"
      to: "checkout"
      probability: 0.50
    - from: "add_to_cart"
      to: "product_view"
      probability: 0.30
    - from: "checkout"
      to: "purchase"
      probability: 0.60
    - from: "checkout"
      to: "add_to_cart"
      probability: 0.2

simulator:
  seed: 42
  concurrent_users: 250
  events_per_second: 500
  session_duration: "60s"
  sinks:
    - "stdout"
    - "file"
  output_file: "/var/log/sim/events.ndjson"
  metrics_addr: ":8080"
  timing:
    distribution: "exponential"
    alpha: 0.04
    mu: 0.0
    sigma: 1.0


