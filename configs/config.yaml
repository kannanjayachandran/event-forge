kafka:
  brokers:
    - "localhost:19092"
  topic: "ecommerce-events"
  batch_size: 100
  batch_timeout: "1s"
  compression: "snappy"

state_machine:
  transitions:
    - from: "landing"
      to: "search"
      probability: 0.8
    - from: "search"
      to: "product_view"
      probability: 0.6
    - from: "product_view"
      to: "add_to_cart"
      probability: 0.3
    - from: "product_view"
      to: "search"
      probability: 0.3
    - from: "add_to_cart"
      to: "checkout"
      probability: 0.5
    - from: "add_to_cart"
      to: "product_view"
      probability: 0.3
    - from: "checkout"
      to: "purchase"
      probability: 0.7
    - from: "checkout"
      to: "add_to_cart"
      probability: 0.2

simulator:
  seed: 42
  concurrent_users: 20
  events_per_second: 25
  session_duration: "60s"
  sinks:
    - "stdout"
    - "file"
  output_file: "/var/log/sim/events.ndjson"
  metrics_addr: ":8080"

