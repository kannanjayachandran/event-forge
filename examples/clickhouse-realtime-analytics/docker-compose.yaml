services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --default-log-level=warn

    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"

    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy|Degraded'" ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s

  simulator:
    build:
      context: ../../
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      redpanda:
        condition: service_healthy

    environment:
      - SIM_KAFKA_BROKERS=redpanda:9092
      - SIM_KAFKA_TOPIC=ecommerce-events

      - SIM_SIMULATOR_SEED=42
      - SIM_SIMULATOR_CONCURRENT_USERS=500
      - SIM_SIMULATOR_EVENTS_PER_SECOND=1000
      - SIM_SIMULATOR_SESSION_DURATION=120s

      - SIM_SIMULATOR_SINKS=stdout

      - SIM_SIMULATOR_METRICS_ADDR=:8080

      - SIM_SIMULATOR_TIMING_DISTRIBUTION=exponential
      - SIM_SIMULATOR_TIMING_ALPHA=0.2

  clickhouse:
    image: clickhouse/clickhouse-server:25.5

    ports:
      - "8123:8123"
      - "9000:9000"

    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/grafana-user.xml:ro
      - clickhouse-data:/var/lib/clickhouse

    depends_on:
      redpanda:
        condition: service_healthy
  grafana:
    image: grafana/grafana:12.0

    ports:
      - "3000:3000"

    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
