apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse

    type: grafana-clickhouse-datasource

    access: proxy

    jsonData:
      server: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: default
      username: grafana

    secureJsonData:
      password: grafana

    editable: false

    isDefault: true